services:
  # =========================================================================
  # KAFKA + ZOOKEEPER (Message Broker)
  # =========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "9095:9092"

  # =========================================================================
  # REDIS (Caching & Deduplication)
  # =========================================================================
  redis:
    image: redis:7.2-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  # =========================================================================
  # MLFLOW (Experiment Tracking & Model Registry)
  # =========================================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5001:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    volumes:
      - mlflow_data:/mlflow

  # =========================================================================
  # PROMETHEUS (Metrics Collection)
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # FASTAPI SERVER (DPO Pipeline API)
  # =========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - kafka
      - redis
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_FEEDBACK: feedback.events
      KAFKA_MOCK_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_BUCKET: ml-artifacts
      S3_MOCK_ENABLED: "true"
      S3_MOCK_DIR: /tmp/s3-mock
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - /tmp/s3-mock:/tmp/s3-mock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: python -m uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  redis_data:
  mlflow_data:
  prometheus_data:

networks:
  default:
    name: dpo-network
