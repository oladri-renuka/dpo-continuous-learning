version: '3.9'

services:
  # Kafka: Real-time feedback stream
  kafka:
    image: bitnami/kafka:latest
    container_name: dpo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dpo-network

  # Zookeeper: Kafka coordination
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: dpo-zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dpo-network

  # Redis: Deduplication cache (24hr TTL)
  redis:
    image: redis:7-alpine
    container_name: dpo-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - dpo-network

  # MinIO: S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: dpo-minio
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data
    networks:
      - dpo-network

  # MinIO Client: Initialize buckets
  minio-init:
    image: minio/mc:latest
    container_name: dpo-minio-init
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/ml-artifacts --ignore-existing;
      /usr/bin/mc mb myminio/feedback --ignore-existing;
      exit 0;
      "
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - dpo-network

volumes:
  redis-data:
  minio-data:

networks:
  dpo-network:
    driver: bridge
