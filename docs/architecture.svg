<svg viewBox="0 0 1600 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000"/>
    </marker>
  </defs>

  <style>
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .title { font-size: 13px; font-weight: bold; }
    .text { font-size: 10px; }
    .arrow { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .label { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <!-- Title -->
  <text x="800" y="30" text-anchor="middle" style="font-size: 24px; font-weight: bold;">DPO Continuous Learning Pipeline</text>

  <!-- TOP ROW: INPUT → MESSAGE QUEUE → AGGREGATION -->
  <text x="65" y="70" class="label">INPUT</text>
  <rect class="box" x="50" y="80" width="130" height="90"/>
  <text x="115" y="110" text-anchor="middle" class="title">User Feedback</text>
  <text x="115" y="128" text-anchor="middle" class="text">preference pairs</text>
  <text x="115" y="143" text-anchor="middle" class="text">thumbs up/down</text>

  <path class="arrow" d="M 180 125 L 220 125"/>

  <text x="240" y="70" class="label">MESSAGE QUEUE</text>
  <rect class="box" x="220" y="80" width="130" height="90"/>
  <text x="285" y="110" text-anchor="middle" class="title">Redis Pub/Sub</text>
  <text x="285" y="128" text-anchor="middle" class="text">feedback_events</text>
  <text x="285" y="143" text-anchor="middle" class="text">24h TTL</text>

  <path class="arrow" d="M 350 125 L 390 125"/>

  <text x="410" y="70" class="label">AGGREGATION</text>
  <rect class="box" x="390" y="80" width="130" height="90"/>
  <text x="455" y="110" text-anchor="middle" class="title">Aggregator</text>
  <text x="455" y="128" text-anchor="middle" class="text">SHA256 dedup</text>
  <text x="455" y="143" text-anchor="middle" class="text">write JSONL</text>

  <!-- ARROW DOWN FROM AGGREGATOR -->
  <path class="arrow" d="M 455 170 L 455 230"/>

  <!-- MIDDLE ROW: STORAGE → ORCHESTRATION → TRAINING DATA → TRAINING -->
  <text x="410" y="230" class="label">STORAGE</text>
  <rect class="box" x="390" y="240" width="130" height="90"/>
  <text x="455" y="270" text-anchor="middle" class="title">data/raw/</text>
  <text x="455" y="288" text-anchor="middle" class="text">daily JSONL</text>
  <text x="455" y="303" text-anchor="middle" class="text">≥500 messages</text>

  <path class="arrow" d="M 520 285 L 560 285"/>

  <text x="580" y="230" class="label">ORCHESTRATION</text>
  <rect class="box" x="560" y="240" width="130" height="90"/>
  <text x="625" y="270" text-anchor="middle" class="title">Orchestrator</text>
  <text x="625" y="288" text-anchor="middle" class="text">dedup + split</text>
  <text x="625" y="303" text-anchor="middle" class="text">90/10 train/val</text>

  <path class="arrow" d="M 690 285 L 730 285"/>

  <text x="750" y="230" class="label">TRAINING DATA</text>
  <rect class="box" x="730" y="240" width="130" height="90"/>
  <text x="795" y="270" text-anchor="middle" class="title">MinIO S3</text>
  <text x="795" y="288" text-anchor="middle" class="text">train.jsonl</text>
  <text x="795" y="303" text-anchor="middle" class="text">val.jsonl</text>

  <path class="arrow" d="M 860 285 L 900 285"/>

  <text x="920" y="230" class="label">TRAINING</text>
  <rect class="box" x="900" y="240" width="130" height="90"/>
  <text x="965" y="270" text-anchor="middle" class="title">Trainer</text>
  <text x="965" y="288" text-anchor="middle" class="text">Llama-2-7B</text>
  <text x="965" y="303" text-anchor="middle" class="text">QLoRA + DPO</text>

  <!-- ARROW DOWN FROM TRAINER TO QUALITY GATE -->
  <path class="arrow" d="M 965 330 L 965 390"/>

  <!-- BOTTOM ROW: QUALITY GATE, DEPLOYMENT -->
  <text x="1000" y="390" class="label">VALIDATION</text>
  <rect class="box" x="900" y="400" width="130" height="110" style="fill: #ffe8e8;"/>
  <text x="965" y="435" text-anchor="middle" class="title">Quality Gate</text>
  <text x="965" y="453" text-anchor="middle" class="text">Accuracy ≥ 72%</text>
  <text x="965" y="468" text-anchor="middle" class="text">Win-Rate ≥ 55%</text>

  <!-- PASS ARROW LEFT -->
  <path class="arrow" d="M 900 455 L 840 455"/>
  <text x="860" y="450" style="font-size: 10px; font-weight: bold;">PASS</text>

  <!-- FAIL ARROW DOWN -->
  <path class="arrow" d="M 965 510 L 965 570"/>
  <text x="975" y="545" style="font-size: 10px; font-weight: bold;">FAIL</text>

  <text x="750" y="390" class="label">DEPLOYMENT</text>
  <rect class="box" x="730" y="400" width="130" height="110"/>
  <text x="795" y="435" text-anchor="middle" class="title">S3 Champion</text>
  <text x="795" y="453" text-anchor="middle" class="text">adapter model</text>
  <text x="795" y="468" text-anchor="middle" class="text">checkpoint</text>

  <path class="arrow" d="M 730 455 L 670 455"/>

  <rect class="box" x="550" y="400" width="120" height="110"/>
  <text x="610" y="435" text-anchor="middle" class="title">API Server</text>
  <text x="610" y="453" text-anchor="middle" class="text">FastAPI</text>
  <text x="610" y="468" text-anchor="middle" class="text">inference</text>

  <!-- EXIT ON FAIL -->
  <rect class="box" x="900" y="570" width="130" height="90" style="fill: #ffcccc; stroke: #c62828; stroke-width: 2;"/>
  <text x="965" y="600" text-anchor="middle" class="title" style="fill: #c62828;">Exit Code 1</text>
  <text x="965" y="618" text-anchor="middle" class="text" style="fill: #c62828;">Pipeline Halts</text>
  <text x="965" y="633" text-anchor="middle" class="text" style="fill: #c62828; font-size: 9px;">No Deployment</text>

  <!-- INFO SECTION -->
  <rect x="50" y="685" width="1500" height="55" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>

  <text x="70" y="705" style="font-size: 11px; font-weight: bold;">REAL SERVICES:</text>
  <text x="70" y="722" class="text">Redis pub/sub     •     MinIO S3 Storage     •     Llama-2-7B (CUDA/CPU)</text>
  <text x="70" y="734" class="text">Real-time feedback events with 24-hour TTL deduplication using SHA256 hashing  Training datasets, trained adapters, model checkpoints  QLoRA (rank 16, alpha 32) + DPO training on real data</text>

  <text x="70" y="750" style="font-size: 11px; font-weight: bold;">COMPLETE FLOW:</text>
  <text x="70" y="765" class="text">User Feedback → Redis Queue → Aggregator (dedup/write) → ≥500 msgs → Orchestrator (split/upload) → Trainer (QLoRA+DPO) → Quality Gate (validate) → S3 Champion → API Server → /predict</text>
</svg>