<svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2; }
      .process { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
      .storage { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 2; }
      .title { font-weight: 600; font-size: 15px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .subtitle { font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #555; }
      .arrow { stroke: #333; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .label-text { font-size: 11px; font-family: monospace; fill: #666; }
      .highlight { fill: #fce4ec; stroke: #c2185b; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="35" text-anchor="middle" style="font-size: 24px; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">DPO Pipeline</text>

  <!-- Layer 1: Collection -->
  <g>
    <text x="50" y="90" style="font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; fill: #999;">Collection</text>

    <rect class="box" x="50" y="110" width="140" height="100" rx="6"/>
    <text class="title" x="120" y="138" text-anchor="middle">User Feedback</text>
    <text class="subtitle" x="120" y="158" text-anchor="middle">preference pairs</text>
    <text class="subtitle" x="120" y="173" text-anchor="middle">thumbs up/down</text>

    <path class="arrow" d="M 190 160 L 240 160"/>
    <text class="label-text" x="210" y="155" text-anchor="middle">Redis Pub/Sub</text>

    <rect class="box" x="240" y="110" width="140" height="100" rx="6"/>
    <text class="title" x="310" y="138" text-anchor="middle">Redis</text>
    <text class="subtitle" x="310" y="158" text-anchor="middle">feedback_events</text>
    <text class="subtitle" x="310" y="173" text-anchor="middle">24h TTL</text>
  </g>

  <!-- Layer 2: Aggregation -->
  <g>
    <text x="450" y="90" style="font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; fill: #999;">Aggregation</text>

    <path class="arrow" d="M 380 160 L 430 160"/>

    <rect class="process" x="430" y="110" width="140" height="100" rx="6"/>
    <text class="title" x="500" y="138" text-anchor="middle">Aggregator</text>
    <text class="subtitle" x="500" y="158" text-anchor="middle">SHA256 dedup</text>
    <text class="subtitle" x="500" y="173" text-anchor="middle">write JSONL</text>

    <path class="arrow" d="M 500 210 L 500 270"/>
    <text class="label-text" x="510" y="245" text-anchor="start">≥500 messages</text>

    <rect class="storage" x="430" y="270" width="140" height="100" rx="6"/>
    <text class="title" x="500" y="298" text-anchor="middle">data/raw/</text>
    <text class="subtitle" x="500" y="318" text-anchor="middle">feedback_*.jsonl</text>
    <text class="subtitle" x="500" y="333" text-anchor="middle">daily JSONL files</text>
  </g>

  <!-- Layer 3: Training -->
  <g>
    <text x="750" y="90" style="font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; fill: #999;">Training Pipeline</text>

    <path class="arrow" d="M 570 320 L 620 320"/>

    <rect class="process" x="620" y="270" width="140" height="100" rx="6"/>
    <text class="title" x="690" y="298" text-anchor="middle">Orchestrator</text>
    <text class="subtitle" x="690" y="318" text-anchor="middle">split 90/10</text>
    <text class="subtitle" x="690" y="333" text-anchor="middle">upload S3</text>

    <path class="arrow" d="M 760 320 L 810 320"/>

    <rect class="storage" x="810" y="270" width="140" height="100" rx="6"/>
    <text class="title" x="880" y="298" text-anchor="middle">S3</text>
    <text class="subtitle" x="880" y="318" text-anchor="middle">train.jsonl</text>
    <text class="subtitle" x="880" y="333" text-anchor="middle">val.jsonl</text>

    <path class="arrow" d="M 950 320 L 1000 320"/>

    <rect class="process" x="1000" y="270" width="140" height="100" rx="6"/>
    <text class="title" x="1070" y="298" text-anchor="middle">Trainer</text>
    <text class="subtitle" x="1070" y="318" text-anchor="middle">QLoRA rank=16</text>
    <text class="subtitle" x="1070" y="333" text-anchor="middle">DPO training</text>
  </g>

  <!-- Layer 4: Validation -->
  <g>
    <text x="1250" y="90" style="font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; fill: #999;">Validation & Serving</text>

    <path class="arrow" d="M 1140 320 L 1190 320"/>

    <rect class="highlight" x="1190" y="270" width="140" height="100" rx="6"/>
    <text class="title" x="1260" y="298" text-anchor="middle">Quality Gate</text>
    <text class="subtitle" x="1260" y="318" text-anchor="middle">Acc ≥ 72%</text>
    <text class="subtitle" x="1260" y="333" text-anchor="middle">Win ≥ 55%</text>

    <!-- Pass arrow -->
    <path class="arrow" d="M 1260 370 L 1260 430"/>
    <text class="label-text" x="1270" y="405" text-anchor="start">PASS</text>

    <!-- Fail arrow -->
    <path class="arrow" d="M 1330 320 L 1430 320"/>
    <text class="label-text" x="1380" y="315" text-anchor="middle">FAIL → Exit</text>

    <rect class="storage" x="1190" y="430" width="140" height="100" rx="6"/>
    <text class="title" x="1260" y="458" text-anchor="middle">S3 Champion</text>
    <text class="subtitle" x="1260" y="478" text-anchor="middle">adapter model</text>
    <text class="subtitle" x="1260" y="493" text-anchor="middle">checkpoint</text>
  </g>

  <!-- Layer 5: Serving -->
  <g>
    <path class="arrow" d="M 1260 530 L 1260 590"/>

    <rect class="process" x="1190" y="590" width="140" height="100" rx="6"/>
    <text class="title" x="1260" y="618" text-anchor="middle">API Server</text>
    <text class="subtitle" x="1260" y="638" text-anchor="middle">FastAPI</text>
    <text class="subtitle" x="1260" y="653" text-anchor="middle">/predict</text>
  </g>

  <!-- Info box -->
  <rect x="50" y="590" width="1120" height="100" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4"/>

  <text x="70" y="615" style="font-size: 12px; font-weight: 600;">Core Technologies</text>

  <text x="70" y="640" style="font-size: 11px;">Redis pub/sub for event streaming • SHA256 dedup with 24h TTL • MinIO S3 for storage</text>
  <text x="70" y="660" style="font-size: 11px;">Llama-2-7B base model • QLoRA adapters (rank 16) • DPO training • Hard quality gates</text>

  <text x="70" y="685" style="font-size: 11px; font-style: italic; color: #666;">Real services, real data (Anthropic/hh-rlhf), no mocks or synthetic data.</text>
</svg>