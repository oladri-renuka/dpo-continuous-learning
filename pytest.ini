[pytest]
# Pytest configuration for DPO pipeline integration tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -s

# Markers
markers =
    integration: Integration tests requiring services
    unit: Unit tests
    slow: Slow tests (service startup, long pipelines)
    kafka: Kafka-related tests
    api: API endpoint tests
    pipeline: Full pipeline tests
    error: Error scenario tests
    data: Data validation tests

# Coverage
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
